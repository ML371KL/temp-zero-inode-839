name: Deploy encrypted dashboard to Pages

on:
  push:
    # `main` carries the site and keeps its history, because a bad commit to the code
    # has to be revertable. `payload` carries one file and is force-pushed to a single
    # commit every time the pipeline publishes, because the encrypted payload is
    # incompressible and its history is worth nothing: every version of it is
    # reproducible from the private repository, and the page never reads more than the
    # current one. Keeping the two apart is what lets the site publish as often as it
    # likes without the repository growing.
    # `main` is deliberately absent here: a push to it deploys only after "Frontend
    # checks" has gone green on that same commit, via the workflow_run trigger below.
    # Otherwise the browser checks would run beside the deployment rather than before
    # it, and a leak-after-lock regression would be live for the minute it takes them
    # to fail. `payload` stays on the direct trigger — it carries one encrypted blob,
    # changes no site code, and the checks do not run on it at all.
    branches: [payload]
  workflow_run:
    workflows: ["Frontend checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A workflow_run fires on completion, success or not, so the conclusion has to be
    # tested here or a red check would deploy anyway. Every other trigger (the payload
    # branch, a manual dispatch) carries no such context and passes straight through.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs. This job holds `pages: write` and `id-token: write`,
      # so a moved tag on any of these actions would be a deployment-capable change to
      # the site that no review would ever see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the site from `main`, whichever branch triggered the run — but on a
          # workflow_run, the exact commit the checks passed on. A workflow_run job
          # checks out the default branch's tip by default, and between the check
          # finishing and the deployment starting `main` can move: the site deployed
          # would then be code no browser check ever saw, which is the whole thing this
          # gate exists to prevent.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - name: Take the payload from its own branch
        # Deploying the site without it would publish a page that cannot unlock, so a
        # missing payload fails here rather than silently going live.
        run: |
          git fetch --depth 1 origin payload
          mkdir -p data
          git show origin/payload:data/portfolio.enc > data/portfolio.enc
          echo "payload: $(wc -c < data/portfolio.enc) bytes from $(git rev-parse --short origin/payload)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
