name: Deploy encrypted dashboard to Pages

on:
  push:
    # `main` carries the site and keeps its history, because a bad commit to the code
    # has to be revertable. `payload` carries one file and is force-pushed to a single
    # commit every time the pipeline publishes, because the encrypted payload is
    # incompressible and its history is worth nothing: every version of it is
    # reproducible from the private repository, and the page never reads more than the
    # current one. Keeping the two apart is what lets the site publish as often as it
    # likes without the repository growing.
    # `main` is deliberately absent here: a push to it deploys only after "Frontend
    # checks" has gone green on that same commit, via the workflow_run trigger below.
    # Otherwise the browser checks would run beside the deployment rather than before
    # it, and a leak-after-lock regression would be live for the minute it takes them
    # to fail. `payload` stays on the direct trigger: the pipeline publishes to it
    # every half hour and must never be made to wait on a browser.
    #
    # But a payload push deploys the *site* too — the checkout below takes the code
    # from `main` — so on its own it would walk straight around the gate: push a
    # broken frontend, watch the checks go red and the deployment be withheld, and
    # then have the next tick put that same commit live thirty minutes later under a
    # green deploy run. The site code it takes is therefore the last commit the checks
    # actually passed on, resolved in the step below, not whatever `main` has become.
    branches: [payload]
  workflow_run:
    workflows: ["Frontend checks"]
    types: [completed]
    # A coarse filter, not the gate. It matches on the triggering run's `head_branch`,
    # a string a fork controls; the job's `if:` below is where the run is actually
    # checked for having come from this repository and from a push.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To ask which commit of `main` the browser checks last passed on. Read-only: this
  # job may look at workflow runs and may not start, cancel or rewrite one.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A workflow_run fires on completion, success or not, so the conclusion has to be
    # tested here or a red check would deploy anyway. Every other trigger (the payload
    # branch, a manual dispatch) carries no such context and passes straight through.
    #
    # The other two tests are what make the trigger a gate rather than an invitation.
    # `on.workflow_run.branches: [main]` filters the *triggering run's* `head_branch`,
    # which is not a branch of this repository at all: "Frontend checks" also runs on
    # `pull_request`, and a fork's default branch is called `main` too, so a pull
    # request from any fork produces a run this filter accepts. Its `head_sha` is the
    # fork's commit, and the step below feeds that straight to `actions/checkout` while
    # this job holds `pages: write` and `id-token: write`. This repository is public and
    # its page is where the owner types the payload password, so that is not defacement
    # but credential capture. `head_repository.full_name` is the only field that says
    # whose commit it is, and `event == 'push'` keeps the whole pull-request path out:
    # a run that reached green on code nobody with write access pushed has proved
    # nothing about what belongs on the live site.
    if: >-
      github.event_name != 'workflow_run'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs. This job holds `pages: write` and `id-token: write`,
      # so a moved tag on any of these actions would be a deployment-capable change to
      # the site that no review would ever see.
      - name: Find the site commit the browser checks passed on
        id: verified
        # On a workflow_run this is simply the commit that was checked — taken from the
        # event rather than from `main`, because between the check finishing and this
        # job starting `main` can move, and the site deployed would then be code no
        # browser ever saw.
        #
        # On every other trigger — the half-hourly payload push above all — it is the
        # newest commit of `main` with a successful "Frontend checks" run. That is what
        # keeps the payload path from walking around the gate: publication is never
        # blocked, but it carries the last verified code rather than the current tip.
        # If the checks have never run to green, there is nothing verified to deploy
        # and this fails rather than guessing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "site from the checked commit ${{ github.event.workflow_run.head_sha }}"
            exit 0
          fi
          # `event=push` is load-bearing, not tidiness. The API's `branch` parameter
          # filters on `head_branch` exactly as the trigger above does, so without it a
          # green check run from a fork's pull request — head branch `main`, head SHA
          # the fork's — is returned as "the last verified commit" and deployed on every
          # half-hourly payload push, indefinitely, with nothing in the log to tell it
          # apart from a normal tick. Only a push to this repository can produce a push
          # run here, and only someone with write access can produce one of those.
          sha=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/frontend-checks.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$sha" ]; then
            # And it still has to be on `main` now. A commit can be force-pushed away
            # or reverted after passing, and `compare` is the cheapest way to ask: an
            # ancestor of `main` reads as "behind", the tip itself as "identical".
            # Anything else is a commit that used to be on the branch or never was, and
            # deploying it would put code back that someone deliberately removed.
            relation=$(gh api \
              "repos/${{ github.repository }}/compare/main...$sha" \
              --jq '.status // empty' 2>/dev/null || true)
            case "$relation" in
              behind|identical)
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
                echo "site from the last verified commit $sha ($relation main)"
                exit 0
                ;;
            esac
            echo "the last verified commit $sha is not on main (compare says '${relation:-unreachable}')" >&2
            exit 1
          fi
          # No green run. Two very different states share that answer, and treating
          # them alike would be wrong either way: refusing forever on the first, or
          # deploying red code on the second.
          any=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/frontend-checks.yml/runs?branch=main&event=push&per_page=1" \
            --jq '.total_count // 0')
          if [ "$any" = "0" ]; then
            # The checks have never run on main at all — the minutes right after they
            # were added, before the first one finishes. Deploying main's tip here is
            # exactly the behaviour this file had before the gate existed, and it
            # cannot persist: the run that is starting right now ends this state.
            echo "sha=main" >> "$GITHUB_OUTPUT"
            echo "Frontend checks have never run on main yet; deploying its tip once" >&2
            exit 0
          fi
          echo "Frontend checks have run on main and none passed; nothing verified to deploy" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.verified.outputs.sha }}
      - name: Take the payload from its own branch
        # Deploying the site without it would publish a page that cannot unlock, so a
        # missing payload fails here rather than silently going live.
        run: |
          git fetch --depth 1 origin payload
          mkdir -p data
          git show origin/payload:data/portfolio.enc > data/portfolio.enc
          echo "payload: $(wc -c < data/portfolio.enc) bytes from $(git rev-parse --short origin/payload)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
